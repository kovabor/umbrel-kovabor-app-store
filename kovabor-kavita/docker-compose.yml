version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-kavita_web_1
      APP_PORT: 5000

  web:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kovabor-kavita_web_1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
