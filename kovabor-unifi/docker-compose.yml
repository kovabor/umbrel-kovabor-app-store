
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-unifi_web_1
      APP_PORT: 8443

  web:
    image: lscr.io/linuxserver/unifi-network-application:latest
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Budapest
      MONGO_USER: root
      MONGO_PASS: "${APP_PASSWORD}"
      MONGO_HOST: unifi-db
      MONGO_PORT: "27017"
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_LIMIT: "1024"
      MEM_STARTUP: "1024"
    ports:
      - "8080:8080/tcp"
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "1900:1900/udp"
      - "8843:8843/tcp"
      - "8880:8880/tcp"
      - "6789:6789/tcp"
      - "5514:5514/udp"
    volumes:
      - "${APP_DATA_DIR}/data/unifi_data:/config"
    depends_on:
      - unifi-db

  unifi-db:
    image: mongo:4.4
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR}/data/db_data:/data/db"
