name: UniFi Hálózatkezelő
tagline: UniFi hálózati eszközök központi kezelése
icon: https://github.com/kovabor/umbrel-kovabor-app-store/blob/master/kovabor-unifi/logo.png
category: networking
version: "9.0.114"
port: 8892

description: >-
  A UniFi Network Server a Ubiquiti központi hálózatkezelő platformja,
  amely lehetővé teszi a UniFi routerek, switchek és hozzáférési pontok
  egyszerű konfigurálását, felügyeletét és karbantartását.

  Az alkalmazás segítségével egyetlen felületen kezelheted a hálózati
  eszközeidet, konfigurálhatod a vezeték nélküli hálózatokat, VLAN-okat,
  biztonsági beállításokat, VPN-kapcsolatokat, valamint nyomon követheted
  a hálózat forgalmát és az eszközök állapotát.

  Az UniFi Network Server lehetőséget biztosít a csatlakoztatott eszközök
  központi firmware-frissítésére, a hálózati statisztikák megtekintésére
  és a hálózati problémák felderítésére.

  Adatbázis-követelmény:
  Az alkalmazás MongoDB 4.4 adatbázist használ. A Docker Compose
  konfigurációban a MongoDB verziója rögzített, nem használható
  helyette automatikusan frissülő latest címke.

  Szükséges hálózati portok:

  - 8893/TCP: HTTPS webes kezelőfelület.
  - 3478/UDP: STUN, az eszközök kapcsolódásához.
  - 10001/UDP: UniFi eszközök helyi hálózati felderítése.
  - 8080/TCP: Kommunikáció a vezérlő és az eszközök között.
  - 1900/UDP: Helyi hálózati felderítés (L2), opcionális.
  - 8843/TCP: Vendégportál HTTPS.
  - 8880/TCP: Vendégportál HTTP.
  - 6789/TCP: Sebességteszt a mobilalkalmazásból.
  - 5514/UDP: Távoli syslog üzenetek fogadása.
  - 8892/TCP: HTTP átirányítás a vendégportálhoz.

  Fontos:
  A webes kezelőfelület kizárólag HTTPS-kapcsolaton keresztül érhető el.
  A böngészőben a HTTPS protokollt kell használni. Fordított proxy vagy
  Cloudflare Tunnel esetén a forgalmat a 8893-as HTTPS portra kell
  továbbítani.

