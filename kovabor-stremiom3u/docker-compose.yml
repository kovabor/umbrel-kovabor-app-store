services:
  app:
    container_name: kovabor-stremio-m3u-addon_app_1
    image: inside4ndroid/stremio-m3u-epg-addon:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - PORT=7000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/data:/data
    ports:
      - ${APP_PORT}:7000
