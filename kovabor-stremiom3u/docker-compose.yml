version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-stremio-m3u-addon_server_1
      APP_PORT: 7000
      PROXY_AUTH_ADD: "false"

  server:
    container_name: kovabor-stremio-m3u-addon_server_1
    image: inside4ndroid/stremio-m3u-epg-addon:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - PORT=7000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/data:/data
