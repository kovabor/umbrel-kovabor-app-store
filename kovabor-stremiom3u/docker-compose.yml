version: "3.7"

services:
  app_server:
    container_name: stremiom3u
    image: inside4ndroid/stremio-m3u-epg-addon:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - PORT=7000
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    ports:
      - ${APP_PORT}:7000
