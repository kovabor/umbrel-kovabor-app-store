services:
  tracktor:
    image: ghcr.io/javedh-dev/tracktor:latest
    container_name: tracktor
    restart: unless-stopped
    ports:
      - '3339:3000'
    environment:
      NODE_ENV: production
      HOST: '0.0.0.0'
      PORT: '3000'
      DB_PATH: /data/tracktor.db
      UPLOADS_DIR: /uploads
      LOG_DIR: /data/logs
      TRACKTOR_DEMO_MODE: 'false'
      FORCE_DATA_SEED: 'false'
    volumes:
      - ./data:/data
      - ./uploads:/uploads
