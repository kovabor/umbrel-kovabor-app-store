version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-tracktor_web_1
      APP_PORT: 3339

  web:
    image: ghcr.io/samuel-ping/tracktor:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - PORT=3339
      - NODE_ENV=production
