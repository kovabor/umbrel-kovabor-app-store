version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-tracktor_web_1
      APP_PORT: 3339

  web:
    image: ghcr.io/javedh-dev/tracktor:latest
    container_name: kovabor-tracktor_web_1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/uploads:/uploads
    environment:
      - NODE_ENV=production
      - TRACKTOR_DEMO_MODE=false
      - FORCE_DATA_SEED=false
      - UPLOADS_DIR=/uploads
      - PORT=3000
      - DB_PATH=/data/tracktor.db
      - LOG_LEVEL=info
      - LOG_DIR=/data/logs
      - BODY_SIZE_LIMIT=Infinity
      - RUNTIME=docker
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
