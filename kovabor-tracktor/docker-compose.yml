version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-tracktor_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/javedh-dev/tracktor:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/uploads:/uploads
    environment:
      - NODE_ENV=production
      - TRACKTOR_DEMO_MODE=false
      - FORCE_DATA_SEED=false
      - UPLOADS_DIR=/uploads
      - PORT=3000
      - DB_PATH=/data/tracktor.db
      - LOG_LEVEL=info
      - LOG_DIR=/data/logs
      - BODY_SIZE_LIMIT=Infinity
      - RUNTIME=docker
