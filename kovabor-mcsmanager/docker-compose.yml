version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:latest
    container_name: kovabor-mcsmanager_app_proxy_1
    environment:
      APP_HOST: kovabor-mcsmanager_web_1
      APP_PORT: 23333
    ports:
      - "${EXPOSED_PORT}:23333"
    restart: on-failure

  web:
    image: mcsmanager/mcsmanager:latest
    container_name: kovabor-mcsmanager_web_1
    restart: always
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ${APP_DATA_DIR}/data:/opt/mcsmanager/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "25565-25575:25565-25575"