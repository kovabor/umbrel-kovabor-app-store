version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-stremhu_server_1
      APP_PORT: 7070
      PROXY_AUTH_ADD: "false"

  server:
    image: s4pp1/stremhu-source:latest
    container_name: kovabor-stremhu_server_1
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=Europe/Budapest
      - PORT=7070
      - NODE_ENV=prod
      - HOST_IP=192.168.0.2
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

volumes:
  data:
    name: stremhu-source-data
