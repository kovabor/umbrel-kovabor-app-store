version: "3.7"

services:
  web:
    image: s4pp1/stremhu-source:latest
    container_name: kovabor-stremhu_web_1
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      - TZ=Europe/Budapest
      - PORT=7070
      - NODE_ENV=prod
      - HOST_IP=192.168.0.2
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    mem_limit: 2g
