version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-stremhu_web_1
      APP_PORT: 3100

  web:
    image: s4pp1/stremhu-source:latest
    container_name: kovabor-stremhu_web_1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - TZ=Europe/Budapest
      - PORT=3100
      - NODE_ENV=prod
