version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kovabor-stremhu_web_1
      APP_PORT: 7070
      PROXY_AUTH_ADD: "false"

  web:
    image: s4pp1/stremhu-source:latest
    container_name: kovabor-stremio-m3u-addon_web_1 # vagy kovabor-stremhu_web_1
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - PORT=7070
      - NODE_ENV=prod
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
